<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌游规则书总览</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#222; --muted:#6b7280;
    --accent:#2b6cb0; --accent-soft:#e8f0fb; --border:#e3e6ea; --hover:#f0f4f8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);}
  .app{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:300px;min-width:280px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .sb-head{padding:18px 18px 12px;border-bottom:1px solid var(--border);}
  .sb-head h1{margin:0 0 4px;font-size:18px;font-weight:700;}
  .sb-head .sub{font-size:12px;color:var(--muted);}
  .search{padding:12px 18px;border-bottom:1px solid var(--border);}
  .search input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fafbfc;color:var(--ink);outline:none;}
  .search input:focus{border-color:var(--accent);background:#fff;}
  .list{flex:1;overflow-y:auto;padding:8px;}
  .item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;}
  .item:hover{background:var(--hover);}
  .item.active{background:var(--accent-soft);border-color:var(--accent);}
  .item .zh{font-size:14px;font-weight:600;}
  .item .en{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.3px;}
  .empty{color:var(--muted);font-size:13px;padding:16px;text-align:center;}
  .main{flex:1;display:flex;flex-direction:column;background:var(--bg);}
  .bar{height:48px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .bar .cur{font-weight:600;font-size:15px;}
  .bar a{font-size:13px;color:var(--accent);text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:6px;}
  .bar a:hover{background:var(--hover);}
  .frame{flex:1;padding:0;}
  iframe{width:100%;height:100%;border:0;background:#fff;display:block;}
  .welcome{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:15px;}
  .back-btn{display:none;font-size:14px;color:var(--accent);text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel);cursor:pointer;}
  .bar .title-wrap{display:flex;align-items:center;gap:10px;min-width:0;}
  .bar .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* == group-tune == */
  .group-head{padding:10px 12px 4px;font-size:12px;font-weight:700;color:var(--accent);
    letter-spacing:.5px;display:flex;align-items:center;gap:6px;}
  .group-head .n{font-weight:600;color:var(--muted);font-size:11px;}
  .group-head.essen{color:#b3541e;}
  .item .tag{display:inline-block;font-size:10px;color:#b3541e;border:1px solid #e8c9ad;
    background:#fdf3ea;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;}
  /* == end group-tune == */
  /* == mobile-tune-injected == */
  @media (max-width:768px){
    .app{flex-direction:column;height:100vh;}
    .sidebar{width:100%;min-width:0;height:100vh;border-right:0;}
    .main{display:none;}
    body.viewing .sidebar{display:none;}
    body.viewing .main{display:flex;width:100%;height:100vh;}
    .back-btn{display:inline-block;flex-shrink:0;}
    .bar{padding:0 10px;height:52px;gap:8px;}
    .sb-head h1{font-size:17px;}
    .search input{font-size:16px;}
  }
  @media (min-width:769px) and (max-width:1024px){
    .sidebar{width:260px;min-width:240px;}
  }
  /* == end mobile-tune == */
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-head">
      <h1>桌游规则书总览</h1>
      <div class="sub" id="count">共 0 本</div>
    </div>
    <div class="search">
      <input id="q" type="text" placeholder="搜索中文名 / 英文名…" autofocus>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="main">
    <div class="bar">
      <span class="title-wrap">
        <button class="back-btn" id="backBtn" type="button">← 返回列表</button>
        <span class="cur" id="cur">未选择</span>
      </span>
      <a id="openLink" href="#" target="_blank" style="display:none">↗ 新标签打开</a>
    </div>
    <div class="frame">
      <iframe id="viewer" style="display:none"></iframe>
      <div class="welcome" id="welcome">← 从左侧选择一本规则书</div>
    </div>
  </main>
</div>
<script>
  const books=[
    // == 埃森 2026 新游戏（后续追加：在这里加一行, group 值用 essen2026） ==
    {file:"PragueUnseen_Rules_CN.html", zh:"布拉格秘境", en:"Prague Unseen", group:"essen2026"},
    {file:"Queen_Alice_Rules_CN.html", zh:"爱丽丝女王", en:"Queen Alice", group:"essen2026"},
    {file:"SixtyBelow_Rules_CN.html", zh:"深寒之下", en:"Sixty Below", group:"essen2026"},
    {file:"DOE_Rules_CN.html", zh:"恶之滴", en:"Drops of Evil", group:"essen2026"},
    {file:"Timespan_Rules_CN.html", zh:"时代跨度", en:"Timespan", group:"essen2026"},
    {file:"Potemkin_Rules_CN.html", zh:"波将金村庄", en:"Potemkin Villages", group:"essen2026"},
    {file:"ASHES_Rules_CN.html", zh:"灰烬：停电协议", en:"ASHES: Blackout Protocol", group:"essen2026"},
    {file:"Gaudi_Rules_CN.html", zh:"高迪", en:"Gaudí", group:"essen2026"},
    {file:"Greylune_Rules_CN.html", zh:"灰月镇", en:"Greylune", group:"essen2026"},
    {file:"Nijar_Rules_CN.html", zh:"尼哈尔", en:"Níjar", group:"essen2026"},
    {file:"Moytura_Rules_CN.html", zh:"莫伊图拉", en:"Moytura", group:"essen2026"},
    {file:"Wildscape_Rules_CN.html", zh:"荒野生机", en:"Wildscape", group:"essen2026"},
    {file:"Wireless_Rules_CN.html", zh:"无线时代", en:"Wireless", group:"essen2026"},
    {file:"Diables_Rules_CN.html", zh:"恶魔之舞", en:"Diables", group:"essen2026"},
    // == 其他规则书 ==
    {file:"Archipels_Rulebook_CN.html", zh:"群岛", en:"Archipels", group:"others"},
    {file:"Athletes_de_Compete_FAQ_CN.html", zh:"运动员大乱斗 规则答疑 FAQ 2.0", en:"Athlètes de Compète FAQ 2.0", group:"others"},
    {file:"BBLL_Rules_CN.html", zh:"熊孩子巫妖领主", en:"Bad Baby Lich Lords", group:"others"},
    {file:"BIM_Rulebook_CN.html", zh:"请相信我！", en:"Believe in Me!", group:"others"},
    {file:"BiY_Rulebook_CN.html", zh:"巴巴就是你", en:"Baba Is You", group:"others"},
    {file:"Biddle_Rules_CN.html", zh:"估算挑战", en:"Biddle", group:"others"},
    {file:"Big2_Rules_CN.html", zh:"锄大弟", en:"Big 2", group:"others"},
    {file:"Catvale_Rules_CN.html", zh:"猫之谷", en:"Catvale", group:"others"},
    {file:"CYA_Rules_CN.html", zh:"盖住你的资产", en:"Cover Your Assets", group:"others"},
    {file:"DiceyDevices_Rules_CN.html", zh:"骰子装置", en:"Dicey Devices", group:"others"},
    {file:"Dirt_and_dust_Rules_CN.html", zh:"泥土与尘埃", en:"Dirt & Dust", group:"others"},
    {file:"EGO_Rules_CN.html", zh:"外星问候组织", en:"EGO", group:"others"},
    {file:"GalileosTruth_Rules_CN.html", zh:"伽利略的真理", en:"Galileo's Truth", group:"others"},
    {file:"Gardling_Rules_CN.html", zh:"园艺精灵", en:"Gardling", group:"others"},
    {file:"Greenwood_Rules_CN.html", zh:"格林伍德", en:"Greenwood", group:"others"},
    {file:"Hercules_Rules_CN.html", zh:"大力神十二试炼", en:"Hercules and the 12 Labors", group:"others"},
    {file:"ICE_Rules_CN.html", zh:"冰封远征", en:"I C E", group:"others"},
    {file:"Iliad_Rules_CN.html", zh:"伊利亚特", en:"Iliad", group:"others"},
    {file:"La_Fleur_CN.html", zh:"繁花", en:"La Fleur", group:"others"},
    {file:"Mahe_Rules_CN.html", zh:"马埃", en:"Mahe", group:"others"},
    {file:"MantisFalls_Rules_CN.html", zh:"谜镇异途", en:"Mantis Falls", group:"others"},
    {file:"Medicus_Rules_CN.html", zh:"医者", en:"Medicus", group:"others"},
    {file:"MR_TC_Base_Rules_CN.html", zh:"议事会（基础游戏）", en:"Mini Rogue: The Council", group:"others"},
    {file:"MR_TC_Add_Rules_CN.html", zh:"议事会（扩展）", en:"Mini Rogue: The Council", group:"others"},
    {file:"Moonlight_Rules_CN.html", zh:"月光", en:"Moonlight", group:"others"},
    {file:"ORBIT_Rules_CN.html", zh:"星际游客轨道竞速", en:"ORBIT", group:"others"},
    {file:"Ritual_Rules_CN.html", zh:"仪式", en:"Ritual", group:"others"},
    {file:"Salamandra_Rules_CN.html", zh:"萨曼德拉", en:"Salamandra", group:"others"},
    {file:"Stubbornmules_Rules_CN.html", zh:"顽固的骡子", en:"Stubborn Mules", group:"others"},
    {file:"sumidagawa_Rules_CN.html", zh:"隅田川之争", en:"Sumidagawa", group:"others"},
    {file:"Taxiover_Rules_CN.html", zh:"疯狂出租车", en:"Taxi Over", group:"others"},
    {file:"Through_the_Desert_Rules_CN.html", zh:"穿越沙漠", en:"Through the Desert", group:"others"},
    {file:"TongaBonga_Rules_CN.html", zh:"环岛营生", en:"Tonga Bonga", group:"others"},
    {file:"TowerUp_Rules_CN.html", zh:"楼起", en:"Tower Up", group:"others"},
    {file:"Twisted_Cryptids_Rules_CN.html", zh:"扭曲传说", en:"Twisted Cryptids", group:"others"},
    {file:"Verso_Rules_CN.html", zh:"双面景观", en:"Verso", group:"others"},
  ];
  const listEl=document.getElementById('list');
  const qEl=document.getElementById('q');
  const frame=document.getElementById('viewer');
  const welcome=document.getElementById('welcome');
  const curEl=document.getElementById('cur');
  const openLink=document.getElementById('openLink');
  const nEssen=books.filter(b=>b.group==='essen2026').length;
  document.getElementById('count').textContent='共 '+books.length+' 本 · 埃森 2026 '+nEssen+' 本';

  const GROUP_META=[
    {id:"essen2026", title:"埃森 2026 新游戏", cls:"essen"},
    {id:"others", title:"其他规则书", cls:""}
  ];
  function render(filter){
    listEl.innerHTML='';
    const f=(filter||'').trim().toLowerCase();
    const matched=books.filter(b=>!f || b.zh.toLowerCase().includes(f) || b.en.toLowerCase().includes(f));
    if(!matched.length){
      listEl.innerHTML='<div class="empty">没有匹配的规则书</div>';
      return;
    }
    GROUP_META.forEach(g=>{
      const items=matched.filter(b=>(b.group||'others')===g.id);
      if(!items.length) return;
      const head=document.createElement('div');
      head.className='group-head '+g.cls;
      head.innerHTML=g.title+' <span class="n">'+items.length+'</span>';
      listEl.appendChild(head);
      items.forEach(b=>{
        const d=document.createElement('div');
        d.className='item';
        d.dataset.file=b.file;
        d.innerHTML='<div class="zh">'+b.zh+(g.id==='essen2026'?'<span class="tag">埃森</span>':'')+'</div><div class="en">'+b.en+'</div>';
        d.onclick=()=>select(b,d);
        listEl.appendChild(d);
      });
    });
  }
  function select(b,elm){
    document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));
    if(elm) elm.classList.add('active');
    curEl.textContent=b.zh+' · '+b.en;
    openLink.href=b.file;
    openLink.style.display='inline-block';
    welcome.style.display='none';
    frame.style.display='block';
    frame.src=b.file;
    document.body.classList.add('viewing');
  }
  document.getElementById('backBtn').addEventListener('click',()=>{
    document.body.classList.remove('viewing');
    frame.src='about:blank';
  });
  qEl.addEventListener('input',()=>render(qEl.value));
  render('');
</script>
</body>
</html>
